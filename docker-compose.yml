services:
  dsh:
    image: ghcr.io/raabo/dsh:latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "3080:3080"
    volumes:
      - dsh-data:/data/dsh
      - dsh-workspace:/workspace
    environment:
      # 远程访问必填：你的 NAS IP 或域名（空格分隔多个，可用 .env 覆盖）
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-}
      DSH_TELEMETRY_DISABLED: "1"

volumes:
  dsh-data:
  dsh-workspace:
