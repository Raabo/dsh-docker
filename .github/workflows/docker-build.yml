name: Build dsh image

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 */6 * * *'        # 每 6 小时检查 npm 新版本
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（忽略镜像已存在检查）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: dsh-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 1. 检出本仓库（含 Dockerfile / proxy.mjs / entrypoint）
      - uses: actions/checkout@v6

      # 2. 取 npm 最新发布版本
      - name: Resolve npm version
        id: ver
        run: |
          V=$(npm view @deepseek-ai/dsh version)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      # 2a. 本仓库 SHA（Dockerfile/entrypoint 变化也要触发重建）
      - name: Resolve own SHA
        id: own
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # 3. Docker tag 必须小写
      - name: Normalize owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # 4. 检查组合 tag（npm 版本 + 本仓库 SHA）是否已存在（两者都没变则跳过）
      - name: Check existing image
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ env.OWNER_LC }}/dsh:${{ steps.ver.outputs.tag }}-r${{ steps.own.outputs.short }} >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.check.outputs.exists == 'true' && inputs.force != 'true'
        run: echo "npm 无新版本（${{ steps.ver.outputs.version }} 已构建），跳过。" >> "$GITHUB_STEP_SUMMARY"

      # 5. Buildx + 登录 ghcr.io（GITHUB_TOKEN 内置）
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.exists == 'false' || inputs.force == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.exists == 'false' || inputs.force == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. 构建 + 推送（npm 包模式：无上游源码，context 为本仓库）
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists == 'false' || inputs.force == 'true'
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/dsh:latest
            ghcr.io/${{ env.OWNER_LC }}/dsh:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ env.OWNER_LC }}/dsh:${{ steps.ver.outputs.tag }}-r${{ steps.own.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/deepseek-ai/deepseek-harness
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.title=DeepSeek Harness (dsh, npm build)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 构建摘要
      - name: Summary
        if: steps.check.outputs.exists == 'false' || inputs.force == 'true'
        run: |
          echo "✅ 已构建并推送:" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ env.OWNER_LC }}/dsh:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/${{ env.OWNER_LC }}/dsh:${{ steps.ver.outputs.tag }} (@deepseek-ai/dsh ${{ steps.ver.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
